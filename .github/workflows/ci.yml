name: CI

on:
  push:
    branches: [main]
  pull_request:

# Stacked pull requests push all their branches at once, so without this a single
# `gh stack push` starts a run for every layer and they queue behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
